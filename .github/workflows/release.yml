name: Release

# Каждый push в main собирает jar и публикует новый релиз:
#   версия = <version из gradle.properties>.<номер сборки>, например 0.1.1.1, 0.1.1.2 ...
# Для «большого» обновления поменяй version в gradle.properties (0.1.1 -> 0.1.2 или 0.2.0):
# нумерация сборок для нового префикса начнётся с 1.
# Чтобы запушить без релиза, начни сообщение коммита с [skip release]
# (только в самом начале: упоминание в тексте коммита релиз не отключает).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # нужно для создания релиза и тега

# Один релиз за раз, иначе два параллельных push получили бы один и тот же номер
concurrency:
  group: release
  cancel-in-progress: false

env:
  JAR_NAME: DaynAC   # имя файла: DaynAC-<версия>.jar

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужны все теги, чтобы посчитать следующий номер сборки

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # В репозитории нет gradlew, поэтому берём ту же версию Gradle, что указана в gradle-wrapper.properties
      - name: Read Gradle version
        id: gradle
        run: |
          ver=$(sed -n 's#.*gradle-\(.*\)-bin\.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties)
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Compute version
        id: version
        run: |
          base=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r[:space:]')
          last=$(git tag -l "v${base}.*" | sed "s/^v${base}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          build=$((${last:-0} + 1 ))
          echo "version=${base}.${build}" >> "$GITHUB_OUTPUT"
          echo "Версия релиза: ${base}.${build}"

      - name: Test and Build
        run: gradle check build -Pversion=${{ steps.version.outputs.version }}

      - name: Prepare jar
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          src="build/libs/${JAR_NAME}-${VERSION}-all.jar"
          if [ ! -f "$src" ]; then
            echo "Не найден $src. Содержимое build/libs:"; ls -la build/libs
            exit 1
          fi
          cp "$src" "dist/${JAR_NAME}-${VERSION}.jar"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          short=$(git rev-parse --short=7 "$GITHUB_SHA")
          {
            echo "Коммит: [\`$short\`](${{ github.server_url }}/${{ github.repository }}/commit/$GITHUB_SHA)"
            echo
            git log -1 --format=%B "$GITHUB_SHA"
          } > notes.md
          gh release create "v${VERSION}" "dist/${JAR_NAME}-${VERSION}.jar" \
            --target "$GITHUB_SHA" \
            --title "${VERSION}" \
            --notes-file notes.md