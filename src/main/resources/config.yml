# ── DaynAC ─────────────────────────────────────────────

# Подробное логгирование каждого удара в чат операторам и консоль.
# Также переключается командой /daynac debug (с сохранением сюда).
hit-logging: false

# ── Пороги детекции ────────────────────────────────────
# Все пороги — вероятности чита от нейросети (0.0–1.0).
# Должны удовлетворять: flag ≤ reduce < cancel ≤ punish.
detection:
  # Скор, с которого игрок считается подозрительным — оповещение админам в чат.
  flag-threshold: 0.65

  # Скор, с которого урон от ударов начинает плавно снижаться.
  reduce-threshold: 0.70

  # Скор, с которого урон полностью отменяется.
  cancel-threshold: 0.90

  # Скор автонаказания (кик). Проверяются и мгновенный скор, и среднее
  # по последним max-recent-predictions ударам — оба должны быть за порогом.
  punish-threshold: 0.95

  # Включено ли автонаказание вообще. false = режим наблюдения:
  # оповещения и снижение урона работают, но наказания не происходит.
  punish-enabled: true

  # Тип наказания при срабатывании punish-threshold:
  #   none — ничего (только запись в лог)
  #   kick — кик с сервера
  #   ban  — бан (встроенный бан-лист сервера)
  punish-action: kick

  # Банить ли по IP одновременно с баном профиля (только для punish-action: ban).
  # true  — бан профиля + бан IP-адреса (жёстче, но на сетях с общим IP
  #         ( NAT, вайфай-кафе, университет) может задеть невиновных.
  # false — бан только по UUID профиля; читер вернётся с нового аккаунта.
  ban-with-ip: false

  # Причина наказания — показывается игроку и пишется в бан-лист.
  punish-reason: "KillAura (обнаружено нейросетью DaynAC)"

  # Сколько последних предсказаний усредняется для множителя урона и наказания.
  max-recent-predictions: 10

  # Сброс после простоя: если игрок не бил никого дольше этого времени (секунды),
  # с него снимаются флаги — активные предсказания очищаются, урон снова проходит
  # целиком, и следующие 16 ударов заново набирают окно, только после них появится
  # новое предсказание. Журнал ударов при этом НЕ чистится: в /daynac allinfo игрок
  # остаётся с «Последними ударами» и максом за всё время, а карточка показывает
  # прогресс нового окна (Ударов: n/16) и вердикт «Флаги сняты после простоя».
  #
  # Проверка идёт раз в секунду. Сброс затрагивает только игроков в сети —
  # флаги вышедших хранятся до TTL-чистки (1 час), чтобы админ успел их разобрать.
  # 0 — сброс выключен (флаги живут до автонаказания или TTL-чистки).
  inactivity-reset-seconds: 30
