# ── DaynAC ─────────────────────────────────────────────

# Подробное логгирование каждого удара в чат операторам и консоль.
# Также переключается командой /daynac debug (с сохранением сюда).
hit-logging: false

# ── Пороги детекции ────────────────────────────────────
# Все пороги — вероятности чита от нейросети (0.0–1.0).
# Должны удовлетворять: flag ≤ reduce < cancel ≤ punish.
detection:
  # Скор, с которого игрок считается подозрительным — оповещение админам в чат.
  flag-threshold: 0.65

  # Скор, с которого урон от ударов начинает плавно снижаться.
  reduce-threshold: 0.70

  # Скор, с которого урон полностью отменяется.
  cancel-threshold: 0.90

  # Скор автонаказания (кик). Проверяются и мгновенный скор, и среднее
  # по последним max-recent-predictions ударам — оба должны быть за порогом.
  punish-threshold: 0.95

  # Включено ли автонаказание вообще. false = режим наблюдения:
  # оповещения и снижение урона работают, но наказания не происходит.
  punish-enabled: true

  # Тип наказания при срабатывании punish-threshold:
  #   none — ничего (только запись в лог)
  #   kick — кик с сервера
  #   ban  — бан + кик (встроенный бан-лист сервера)
  punish-action: kick

  # Причина наказания — показывается игроку и пишется в бан-лист.
  punish-reason: "KillAura (обнаружено нейросетью DaynAC)"

  # Сколько последних предсказаний усредняется для множителя урона и наказания.
  max-recent-predictions: 10
