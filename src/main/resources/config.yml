# ── DaynAC ─────────────────────────────────────────────

# Подробное логгирование каждого удара в чат операторам и консоль.
# Также переключается командой /daynac debug (с сохранением сюда).
hit-logging: false

# ── Пороги детекции ────────────────────────────────────
# Все пороги — вероятности чита от нейросети (0.0–1.0).
# Должны удовлетворять: flag ≤ reduce < cancel ≤ punish.
detection:
  # Скор, с которого игрок считается подозрительным — оповещение админам в чат.
  flag-threshold: 0.65

  # Кулдаун оповещений (секунды): как часто ОДИН игрок может триггерить сообщение
  # админам о необычном ударе. Первый подозрительный удар оповещает мгновенно;
  # удары внутри кулдауна не пропадают — они суммируются в следующем оповещении
  # («ещё N уд. за T с, макс X.XX»), а при сбросе боя — итоговым сообщением.
  # Засчитанное новое окно наказания и сам факт кика/бана проходят мимо кулдауна:
  # админ гарантированно увидит «окна 2/2 — наказание» и сообщение о наказании.
  # На детекцию кулдаун не влияет: снижение урона, окна наказания и автонаказание
  # работают как раньше. 0 = без кулдауна (оповещение на каждый удар ≥
  # flag-threshold — при высокой CPS это спам в чате админов и в консоли).
  alert-cooldown-seconds: 5

  # Скор, с которого урон от ударов начинает плавно снижаться.
  reduce-threshold: 0.70

  # Скор, с которого урон полностью отменяется.
  cancel-threshold: 0.90

  # Скор автонаказания (кик/бан). Решение принимается не по одному окну:
  # см. punish-confirm-windows ниже.
  punish-threshold: 0.95

  # Сколько НЕЗАВИСИМЫХ окон подряд должны дать скор ≥ punish-threshold, чтобы
  # сработало наказание. Окно — последние 16 ударов, оно пересчитывается на каждый
  # удар, поэтому соседние оценки почти совпадают; независимым считается только
  # окно, пришедшее ≥ 16 ударов после предыдущего (общих ударов нет).
  #   1 — достаточно одного окна (16 ударов)
  #   2 — два окна подряд (≈ 32 удара) — по умолчанию
  #   3 — три окна подряд (≈ 48 ударов), самый осторожный вариант
  # Независимому окну дают ещё до 8 ударов (половина окна), чтобы показать скор
  # ≥ punish-threshold; если и тогда оно чистое (< punish-threshold), серия прерывается.
  punish-confirm-windows: 2

  # Включено ли автонаказание вообще. false = режим наблюдения:
  # оповещения и снижение урона работают, но наказания не происходит.
  punish-enabled: true

  # Тип наказания при срабатывании punish-threshold:
  #   none — ничего (только запись в лог)
  #   kick — кик с сервера
  #   ban  — бан (встроенный бан-лист сервера)
  punish-action: kick

  # Банить ли по IP одновременно с баном профиля (только для punish-action: ban).
  # true  — бан профиля + бан IP-адреса (жёстче, но на сетях с общим IP
  #         ( NAT, вайфай-кафе, университет) может задеть невиновных.
  # false — бан только по UUID профиля; читер вернётся с нового аккаунта.
  ban-with-ip: false

  # Причина наказания — показывается игроку и пишется в бан-лист.
  punish-reason: "KillAura (обнаружено нейросетью DaynAC)"

  # Сколько последних предсказаний усредняется для множителя урона и наказания.
  max-recent-predictions: 10

  # Сброс после простоя: если игрок не бил никого дольше этого времени (секунды),
  # с него снимаются флаги — активные предсказания очищаются, урон снова проходит
  # целиком, и следующие 16 ударов заново набирают окно, только после них появится
  # новое предсказание. Журнал ударов при этом НЕ чистится: в /daynac allinfo игрок
  # остаётся с «Последними ударами» и максом за всё время, а карточка показывает
  # прогресс нового окна (Ударов: n/16) и вердикт «Флаги сняты после простоя».
  #
  # Проверка идёт раз в секунду. Сброс затрагивает только игроков в сети —
  # флаги вышедших хранятся до TTL-чистки (1 час), чтобы админ успел их разобрать.
  # 0 — сброс выключен (флаги живут до автонаказания или TTL-чистки).
  inactivity-reset-seconds: 30

  # После сброса по простою плагин ещё столько секунд помнит скор игрока и по нему
  # снижает урон в новом бою, пока не набралось новое окно ударов (первые 16 ударов
  # без вердикта). Скор линейно затухает до нуля. 0 = не помнить (чистый лист).
  carry-over-seconds: 600

# ── Обучение ───────────────────────────────────────────
training:
  # По какой группе делить векторы на train/val/test, чтобы данные одной группы не
  # оказались одновременно в обучении и в тесте (окна одного игрока очень похожи):
  #   session — по сессии записи (от /daynac record <ник> legit|cheat до off);
  #             нужно ≥ 3 сессий на каждый класс
  #   player  — по игроку (строже); нужно ≥ 3 разных игроков на каждый класс
  # Если групп меньше, разбиение случайное по окнам, метрики будут завышены —
  # после /daynac train и в /daynac eval плагин предупредит об этом.
  split-by: session